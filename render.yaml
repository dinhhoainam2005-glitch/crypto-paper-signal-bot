services:
  - type: web
    name: crypto-paper-signal-bot
    runtime: python
    plan: free
    buildCommand: python -m compileall paper_signal_bot
    startCommand: python -m paper_signal_bot.web
    envVars:
      - key: PAPER_ONLY
        value: "true"
      - key: BINANCE_FAPI_BASE_URL
        value: https://fapi.binance.com
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: MAX_SIGNALS_RETAINED
        value: "500"
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_STARTUP_ENABLED
        value: "true"
      - key: TELEGRAM_HEARTBEAT_ENABLED
        value: "true"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "3600"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
