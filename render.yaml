services:
  - type: web
    name: crypto-paper-signal-bot
    runtime: python
    plan: free
    buildCommand: python -m compileall paper_signal_bot
    startCommand: python -m paper_signal_bot.web
    envVars:
      - key: PAPER_ONLY
        value: "true"
      - key: BINANCE_FAPI_BASE_URL
        value: https://fapi.binance.com
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: MAX_INTERNAL_SCAN_INTERVAL_SECONDS
        value: "60"
      - key: MAX_SIGNAL_ENTRY_LAG_SECONDS
        value: "600"
      - key: MAX_SIGNAL_CHASE_BPS
        value: "40"
      - key: MAX_SIGNALS_RETAINED
        value: "500"
      - key: MAX_MARKET_EVENTS_RETAINED
        value: "500"
      - key: MAX_MARKET_PULSE_LAG_SECONDS
        value: "600"
      - key: MAX_MARKET_PULSE_EVENTS_PER_SCAN
        value: "12"
      - key: LIQUIDITY_INTEL_ENABLED
        value: "true"
      - key: MAX_LIQUIDITY_EVENT_LAG_SECONDS
        value: "600"
      - key: MAX_LIQUIDITY_EVENTS_PER_SCAN
        value: "4"
      - key: LIQUIDITY_ALERT_SCORE_MIN
        value: "55"
      - key: HYPERLIQUID_API_BASE_URL
        value: https://api.hyperliquid.xyz
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_STARTUP_ENABLED
        value: "true"
      - key: TELEGRAM_HEARTBEAT_ENABLED
        value: "true"
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: "3600"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
