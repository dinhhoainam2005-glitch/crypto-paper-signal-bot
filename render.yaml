services:
  - type: worker
    name: crypto-paper-signal-bot
    runtime: python
    plan: starter
    buildCommand: python -m compileall paper_signal_bot
    startCommand: python -m paper_signal_bot.worker
    envVars:
      - key: PAPER_ONLY
        value: "true"
      - key: BINANCE_FAPI_BASE_URL
        value: https://fapi.binance.com
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: MAX_SIGNALS_RETAINED
        value: "500"
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
