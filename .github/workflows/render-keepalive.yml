name: Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Render scan endpoint
        env:
          RENDER_SCAN_TOKEN: ${{ secrets.RENDER_SCAN_TOKEN }}
        run: |
          if [ -n "$RENDER_SCAN_TOKEN" ]; then
            curl --fail --silent --show-error --max-time 45 --retry 2 \
              -H "X-Scan-Token: $RENDER_SCAN_TOKEN" \
              https://crypto-paper-signal-bot-web.onrender.com/scan
          else
            curl --fail --silent --show-error --max-time 45 --retry 2 \
              https://crypto-paper-signal-bot-web.onrender.com/scan
          fi
