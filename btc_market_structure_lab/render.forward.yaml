services:
  - type: web
    name: btc-market-structure-forward
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: btc_market_structure_lab
    buildCommand: pip install .
    startCommand: python -m market_structure.service
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: off
    numInstances: 1
    disk:
      name: btc-structure-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_ROOT
        value: /var/data/forward
      - key: SEGMENT_DURATION_SECONDS
        value: "300"
      - key: SEGMENT_OVERLAP_SECONDS
        value: "30"
      - key: DETECTOR_EVERY_SEGMENTS
        value: "12"
      - key: RAW_RETENTION_SEGMENTS
        value: "2"
      - key: TELEGRAM_HEARTBEAT_SECONDS
        value: "3600"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
