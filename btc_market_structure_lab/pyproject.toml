[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-market-structure-lab"
version = "0.1.0"
description = "BTC-only clean-room market-structure research"
requires-python = ">=3.11"
dependencies = ["websockets>=17.4,<18"]

[tool.setuptools.packages.find]
where = ["."]
include = ["market_structure*"]
